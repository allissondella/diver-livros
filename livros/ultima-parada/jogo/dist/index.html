<meta charset="utf-8">
<title>Última Parada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Kalam:wght@400&family=Old+Standard+TT:wght@400;700&family=VT323&display=swap">
<style>
/* Última Parada — um porão em 1996: escuro quase total, luz âmbar de lâmpada velha,
   vermelho só no LED. Tema único, escuro por escolha. */
:root {
  color-scheme: dark;
  --void: #040302;
  --ink: #d6ccb8;
  --dim: #8b8170;
  --faint: #4d4639;
  --amber: #c98a2e;
  --led: #ff3b22;
  --paper: #d8c79d;
  --paper-ink: #2a2318;
  --blue-ink: #1f3a7a;
  --pencil: #3c3a36;
  --f-ui: "IBM Plex Mono", ui-monospace, "Courier New", monospace;
  --f-led: "VT323", "Courier New", monospace;
  --f-cec: "Caveat", "Comic Sans MS", cursive;
  --f-mar: "Kalam", "Comic Sans MS", cursive;
  --f-aur: "Architects Daughter", "Comic Sans MS", cursive;
  --f-news: "Old Standard TT", Georgia, "Times New Roman", serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); overflow: hidden; }
body { font: 14px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible { outline: 1px dashed var(--amber); outline-offset: 3px; }

#stage {
  position: fixed;
  top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
  left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
  background: var(--void);
  user-select: none; -webkit-user-select: none;
}
#scr { position: absolute; display: block; touch-action: none; }

/* HUD: ocupa exatamente a caixa do canvas (o motor define as variáveis) */
#hud {
  position: absolute; left: var(--gx, 0); top: var(--gy, 0);
  width: var(--gw, 100%); height: var(--gh, 100%);
  pointer-events: none; font-size: clamp(11px, 1.15vw, 15px);
}
#hud > * { pointer-events: auto; }
#hud #label, #hud #toast, #hud #top, #hud #bar { pointer-events: none; }
#bar > * { pointer-events: auto; }

.turn {
  position: absolute; top: 18%; bottom: 22%; width: clamp(36px, 5%, 72px);
  background: transparent; border: 0; color: var(--dim); opacity: .25;
  font-size: clamp(28px, 4vw, 56px); transition: opacity .3s;
}
.turn:hover, .turn:focus-visible { opacity: .9; color: var(--ink); }
#turnL { left: 0; }
#turnR { right: 0; }

#top {
  position: absolute; top: 1.4%; left: 0; right: 0; display: flex; justify-content: center;
  padding: 0 2.2%; color: var(--faint); letter-spacing: .14em; text-transform: uppercase; font-size: .82em;
}
#top #clock { position: absolute; right: 2.2%; top: 0; }
#clock {
  font-family: var(--f-led); font-size: 1.9em; letter-spacing: .08em; color: var(--led);
  text-shadow: 0 0 6px rgba(255, 50, 20, .7), 0 0 18px rgba(255, 40, 10, .35); line-height: 1;
}
/* o relógio é o da filmadora no peito: o ponto vermelho de REC pisca ao lado */
#clock.rec i { display: inline-block; width: .42em; height: .42em; border-radius: 50%; background: var(--led); margin-right: .4em; vertical-align: .12em;
  box-shadow: 0 0 8px rgba(255, 40, 10, .8); animation: rec 1.2s steps(1) infinite; }
@keyframes rec { 50% { opacity: .15; } }

#label {
  position: absolute; left: 0; right: 0; bottom: 15%; text-align: center;
  color: var(--ink); letter-spacing: .06em; text-shadow: 0 1px 6px #000, 0 0 2px #000;
  min-height: 1.5em;
}
#msg {
  position: absolute; left: 50%; bottom: 20%; transform: translateX(-50%);
  width: min(62ch, 82%); padding: .9em 1.2em; background: rgba(6, 5, 3, .86);
  border-left: 2px solid var(--amber); color: var(--ink); line-height: 1.6; cursor: pointer;
}
#toast {
  position: absolute; right: 2.2%; top: 9%; padding: .5em .9em; background: rgba(20, 16, 9, .92);
  border: 1px solid var(--faint); color: var(--paper); font-size: .9em;
}

#bar {
  position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end;
  justify-content: space-between; gap: 1em; padding: 0 2.2% 1.6%;
}
#inv { display: flex; gap: .5em; flex-wrap: wrap; min-width: 0; }
.item {
  display: flex; align-items: center; gap: .45em; padding: .35em .7em; background: rgba(12, 10, 6, .85);
  border: 1px solid var(--faint); color: var(--paper); letter-spacing: .05em;
}
.item canvas { width: 26px; height: 26px; }
.item[aria-pressed="true"] { border-color: var(--amber); color: #fff; box-shadow: 0 0 10px rgba(201, 138, 46, .35); }
#tools { display: flex; gap: .5em; }
#tools button {
  padding: .45em .9em; background: rgba(12, 10, 6, .85); border: 1px solid var(--faint);
  color: var(--dim); letter-spacing: .06em;
}
#tools button:hover { color: var(--ink); border-color: var(--dim); }
#tlCount { color: var(--paper); font-weight: 500; margin-left: .3em; }
.pulse { animation: pulse 1.4s ease-out 2; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(216, 199, 157, .6); } 100% { box-shadow: 0 0 0 14px rgba(216, 199, 157, 0); } }

#intro {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2.4em; background: #000; padding-inline: max(16px, 6vw); z-index: 20;
}
#introText {
  font-family: var(--f-ui); color: var(--dim); max-width: 46ch; line-height: 2; font-size: clamp(13px, 1.5vw, 17px);
}
#introText p { margin: 0 0 1em; opacity: 0; animation: appear 1.6s ease forwards; }
#introText .when { font-family: var(--f-led); color: var(--led); font-size: 1.6em; letter-spacing: .08em; opacity: 0;
  text-shadow: 0 0 8px rgba(255, 50, 20, .6); }
@keyframes appear { to { opacity: 1; } }
#btnStart {
  background: transparent; border: 1px solid var(--faint); color: var(--ink); padding: .8em 1.6em;
  letter-spacing: .14em; text-transform: uppercase; font-size: .9em;
}
#btnStart:hover { border-color: var(--amber); color: #fff; }

#rotate {
  display: none; position: absolute; inset: 0; z-index: 50; background: #000; color: var(--dim);
  align-items: center; justify-content: center; text-align: center; padding-inline: max(16px, 8vw);
  letter-spacing: .1em;
}
@media (orientation: portrait) and (max-width: 700px) { #rotate { display: flex; } }
@media (prefers-reduced-motion: reduce) {
  #introText p, #introText .when { animation: none; opacity: 1; }
  .pulse { animation: none; }
}
/* Sobreposições: papéis, linha do tempo, caderno, diário */
.ov {
  position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
  background: rgba(3, 2, 1, .9); padding: 3vh max(16px, 3vw); overflow-y: auto;
}
.ov[hidden] { display: none; }
.ovIn { position: relative; display: flex; flex-direction: column; gap: 1.2em; align-items: center; max-width: 100%; margin: auto; }
.ovIn.wide { width: min(960px, 100%); align-items: stretch; }
.ovBar { display: flex; flex-wrap: wrap; gap: .6em; align-items: center; justify-content: center; color: var(--dim); font-size: .86em; }
.ovBar button {
  background: rgba(14, 11, 7, .9); border: 1px solid var(--faint); color: var(--dim); padding: .45em .95em; letter-spacing: .06em;
}
.ovBar button:hover:not(:disabled) { color: var(--ink); border-color: var(--dim); }
.ovBar button:disabled { opacity: .45; cursor: default; }
.ovHead { display: flex; justify-content: space-between; align-items: baseline; gap: 1em; flex-wrap: wrap; }
.ovHead h2 { margin: 0; font: 400 1.6em var(--f-led); letter-spacing: .12em; color: var(--paper); text-transform: uppercase; }
#tlProgress { color: var(--dim); font-size: .85em; }
#paperBg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; filter: blur(1px); }

/* ——— Papéis ——— */
.paper {
  position: relative; width: min(54ch, 92vw); min-height: 14em; padding: 2.2em 2.4em 2.6em;
  color: var(--paper-ink); background-color: var(--paper); line-height: 1.75; font-size: clamp(15px, 1.6vw, 19px);
  transform: rotate(var(--rot, -1deg)); box-shadow: 0 18px 50px rgba(0, 0, 0, .8), inset 0 0 70px rgba(80, 55, 20, .45);
  background-image:
    radial-gradient(ellipse 30% 22% at 82% 18%, rgba(120, 80, 30, .28), transparent 70%),
    radial-gradient(ellipse 22% 30% at 12% 86%, rgba(110, 70, 25, .25), transparent 70%),
    radial-gradient(ellipse 60% 50% at 50% 50%, transparent 60%, rgba(90, 60, 20, .35));
}
.paper p { margin: 0 0 .7em; }
.paper .h { font-weight: 700; }
.paper .sign { text-align: right; margin-top: 1em; }
.paper .stamp { font: .78em var(--f-ui); letter-spacing: .1em; text-transform: uppercase; opacity: .55; margin-bottom: 1.2em; }

.paper.aurelio {
  font-family: var(--f-aur); color: var(--pencil);
  background-image:
    radial-gradient(ellipse 30% 22% at 82% 18%, rgba(120, 80, 30, .25), transparent 70%),
    repeating-linear-gradient(0deg, transparent 0 23px, rgba(60, 90, 120, .28) 23px 24px),
    repeating-linear-gradient(90deg, transparent 0 23px, rgba(60, 90, 120, .28) 23px 24px);
  background-color: #dcd3b4;
}
.paper.marina {
  font-family: var(--f-mar); color: var(--blue-ink); padding-left: 4.2em; background-color: #ddd2b0;
  background-image:
    radial-gradient(circle at 1.6em 18%, var(--void) 0 .45em, transparent .5em),
    radial-gradient(circle at 1.6em 50%, var(--void) 0 .45em, transparent .5em),
    radial-gradient(circle at 1.6em 82%, var(--void) 0 .45em, transparent .5em),
    linear-gradient(90deg, transparent 3.3em, rgba(170, 40, 40, .45) 3.3em 3.4em, transparent 3.4em),
    repeating-linear-gradient(180deg, transparent 0 1.7em, rgba(60, 90, 150, .25) 1.7em calc(1.7em + 1px));
}
.paper.cecilia {
  font-family: var(--f-cec); font-size: clamp(19px, 2.1vw, 25px); color: #1d2f6b; line-height: 1.55; background-color: #e2d8bb;
  border-top: 14px dotted rgba(20, 15, 8, .85);
  background-image: repeating-linear-gradient(180deg, transparent 0 1.55em, rgba(70, 100, 160, .3) 1.55em calc(1.55em + 1px));
}
.paper.recorte {
  font-family: var(--f-news); color: #1e1c18; background-color: #cbc2a6; width: min(46ch, 92vw);
  clip-path: polygon(0 1%, 4% 0, 12% 1.5%, 30% .2%, 55% 1.2%, 78% 0, 100% 1%, 99% 30%, 100% 62%, 98.5% 100%, 70% 99%, 40% 100%, 12% 98.8%, 0 100%, 1% 60%);
}
.paper.recorte .paperName { font: 400 .72em var(--f-news); letter-spacing: .18em; text-transform: uppercase; border-bottom: 1px solid #555; padding-bottom: .3em; margin-bottom: .6em; }
.paper.recorte .h { font-size: 1.45em; line-height: 1.15; margin-bottom: .6em; }
.paper.recorte .body { column-count: 2; column-gap: 1.4em; font-size: .86em; text-align: justify; hyphens: auto; }
.paper.lucia {
  font-family: var(--f-mar); color: #3a3428; background-color: #b99a6a;
  background-image: radial-gradient(ellipse 70% 60% at 50% 50%, transparent 55%, rgba(60, 35, 10, .45)),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, .03) 0 2px, transparent 2px 5px);
}
.paper.planta {
  font-family: var(--f-aur); color: #233a5a; background-color: #b9c4c6;
  background-image: repeating-linear-gradient(0deg, transparent 0 39px, rgba(30, 60, 90, .2) 39px 40px),
    repeating-linear-gradient(90deg, transparent 0 39px, rgba(30, 60, 90, .2) 39px 40px);
}
.paper.mofo { filter: sepia(.4) brightness(.78) contrast(1.05); }
.paper.mofo::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(50, 70, 30, .55) 0 4%, transparent 9%),
    radial-gradient(circle at 70% 64%, rgba(40, 55, 25, .5) 0 6%, transparent 12%),
    radial-gradient(circle at 86% 14%, rgba(30, 40, 20, .45) 0 3%, transparent 8%),
    radial-gradient(ellipse 80% 70% at 50% 50%, transparent 40%, rgba(40, 30, 10, .55));
}
.paper.molhada { filter: brightness(.9) saturate(.8); }
.paper.molhada .run { color: transparent; text-shadow: 0 0 3px rgba(29, 47, 107, .9); }

/* ——— Linha do tempo ——— */
#tlList { list-style: none; margin: 0; padding: 0 0 0 1.6em; border-left: 1px solid var(--faint); display: flex; flex-direction: column; gap: .4em; }
#tlList li { position: relative; }
#tlList li::before {
  content: ""; position: absolute; left: -1.6em; top: 1.05em; width: .9em; height: 1px; background: var(--faint);
}
.tlItem {
  display: grid; grid-template-columns: 7.5em 1fr; gap: 1em; width: 100%; text-align: left; align-items: baseline;
  background: transparent; border: 1px solid transparent; padding: .5em .8em; color: var(--ink);
}
.tlItem:hover { border-color: var(--faint); background: rgba(216, 199, 157, .05); }
.tlItem .d { font-family: var(--f-led); font-size: 1.35em; color: var(--amber); letter-spacing: .05em; font-variant-numeric: tabular-nums; }
.tlItem .t { min-width: 0; }
.tlItem .w { display: block; color: var(--dim); font-size: .8em; letter-spacing: .05em; }
.tlItem.new .d::after { content: " ●"; color: var(--led); font-size: .6em; vertical-align: middle; }
.tlGap { color: var(--faint); padding: .3em .8em; letter-spacing: .3em; }
.tlEmpty { color: var(--dim); }

/* ——— Caderno ——— */
.spiral {
  display: grid; grid-template-columns: 1fr; gap: 0; width: min(64ch, 92vw); background: #ddd3b6; color: #1d2f6b;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .8), inset 0 0 80px rgba(70, 50, 20, .4); position: relative;
}
.spiral::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 18px; transform: translateX(-50%);
  background: repeating-linear-gradient(180deg, transparent 0 10px, #222 10px 16px, transparent 16px 26px);
}
.pg { padding: 1.4em 2em 1.6em; min-width: 0;
  background-image: repeating-linear-gradient(180deg, transparent 0 1.9em, rgba(70, 100, 160, .3) 1.9em calc(1.9em + 1px)); }
.pg h3 { margin: 0 0 .6em; font: 400 .78em var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: #6b5f48; }
#notes {
  width: 100%; min-height: 22em; height: 100%; resize: none; border: 0; background: transparent;
  font: 500 clamp(17px, 1.9vw, 22px)/1.9em var(--f-cec); color: #33302a; outline: none;
}
@media (max-width: 760px) { .spiral::before { display: none; } }

/* ——— Diário de Marina ——— */
.book {
  width: min(58ch, 92vw); padding: 1.1em; background: #1f3524; border-radius: 4px 10px 10px 4px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .8), inset 0 0 0 2px rgba(0, 0, 0, .4), inset 6px 0 18px rgba(0, 0, 0, .6);
}
.dpage {
  min-height: 24em; padding: 1.8em 2em; background: #d9cda9; color: var(--blue-ink); font: clamp(16px, 1.7vw, 20px)/1.8 var(--f-mar);
  box-shadow: inset 0 0 60px rgba(90, 60, 20, .45);
  background-image: repeating-linear-gradient(180deg, transparent 0 1.8em, rgba(60, 90, 150, .2) 1.8em calc(1.8em + 1px));
}
.dpage .dd { font-weight: 400; text-decoration: underline; text-underline-offset: .25em; }
.dpage .cifra { display: inline-block; margin-top: .4em; letter-spacing: .22em; font-family: var(--f-aur); color: #8a1f1f; }
.dpage .ceci { display: block; margin-top: 1.2em; font: 500 1.15em var(--f-cec); color: #12329a; transform: rotate(-2deg); }
#dNum { min-width: 6em; text-align: center; }

#endText { max-width: 48ch; color: var(--ink); line-height: 2; text-align: center; font-size: clamp(14px, 1.6vw, 18px); }
#endText .when { font-family: var(--f-led); color: var(--led); font-size: 2.4em; display: block; }

/* a folha copiada pela Cecília: a palavra sublinhada duas vezes */
.paper .dupla { text-decoration: underline double; text-underline-offset: 3px; font-weight: 700; }
/* ——— Onda 2: cadeados, mural, mapa ——— */
.lockTitle { margin: 0; color: var(--dim); letter-spacing: .14em; text-transform: uppercase; font-size: .82em; }
.lockMsg { margin: 0; min-height: 1.6em; color: var(--paper); text-align: center; max-width: 44ch; }
#lockBox { display: flex; flex-direction: column; align-items: center; }
.shackle {
  width: 7.2em; height: 5.6em; border: 1.1em solid #8f8e86; border-bottom: 0; border-radius: 3.6em 3.6em 0 0;
  margin-bottom: -.4em; transition: transform .5s cubic-bezier(.2, .8, .3, 1.4);
  box-shadow: inset 0 .25em 0 rgba(255, 255, 255, .25), 0 .2em .4em rgba(0, 0, 0, .6);
}
.lockBody {
  position: relative; display: flex; gap: .45em; padding: 1.2em 1.3em 1.4em; border-radius: .5em;
  background: linear-gradient(160deg, #b8933c, #8b6a22 55%, #6d5118); box-shadow: inset 0 .2em 0 rgba(255, 235, 170, .35), inset 0 -.3em 0 rgba(40, 25, 5, .45), 0 1.2em 2.4em rgba(0, 0, 0, .7);
}
.lockBody::after { content: "PAPAIZ"; position: absolute; left: 0; right: 0; bottom: .25em; text-align: center; font: 600 .62em var(--f-ui); letter-spacing: .3em; color: rgba(40, 25, 5, .55); }
.wheel { display: flex; flex-direction: column; align-items: center; gap: .2em; }
.wheel button {
  width: 2.6em; height: 1.8em; background: rgba(30, 22, 8, .55); border: 1px solid rgba(30, 20, 5, .6); color: #f1e2b0; font-size: .9em; line-height: 1;
}
.wheel button:hover { background: rgba(30, 22, 8, .8); }
.wheel output {
  display: grid; place-items: center; width: 2.4em; height: 2.9em; font: 500 1.5em var(--f-ui); color: #1b1710;
  background: linear-gradient(180deg, #6d675a, #e9e2cc 30%, #f4efdc 50%, #e9e2cc 70%, #6d675a); border-radius: .15em;
  box-shadow: inset 0 0 .3em rgba(0, 0, 0, .5);
}
.wheel output.tick { animation: tick .14s ease-out; }
@keyframes tick { from { transform: translateY(-.2em); } to { transform: none; } }
#lockBox.open .shackle { transform: translateY(-1.6em); }
#lockBox.shake .lockBody { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-.4em); } 40%, 80% { transform: translateX(.4em); } }

/* cadeado direcional: corpo redondo, bolinha no meio */
.dirBody {
  position: relative; width: 13em; height: 13em; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #c9c7bd, #8e8c84 55%, #5d5b55); box-shadow: inset 0 .3em 0 rgba(255, 255, 255, .25), 0 1.2em 2.4em rgba(0, 0, 0, .7);
}
.dirBody .knob { width: 3.4em; height: 3.4em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4a4944, #1c1b19); transition: transform .12s; }
.dirBody button {
  position: absolute; width: 3.2em; height: 3.2em; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .35);
  background: rgba(30, 30, 28, .25); color: #22211e; font-size: 1.1em; font-weight: 600;
}
.dirBody button:hover { background: rgba(30, 30, 28, .45); color: #eee; }
.dirBody .u { top: .6em; left: calc(50% - 1.6em); } .dirBody .d { bottom: .6em; left: calc(50% - 1.6em); }
.dirBody .l { left: .6em; top: calc(50% - 1.6em); } .dirBody .r { right: .6em; top: calc(50% - 1.6em); }
.dirSeq { display: flex; gap: .5em; min-height: 2em; margin-top: 1em; font: 1.3em var(--f-led); color: var(--paper); letter-spacing: .1em; }
.dirSeq span { width: 1.4em; text-align: center; border-bottom: 1px solid var(--faint); }
.dirPull { margin-top: .8em; background: rgba(14, 11, 7, .9); border: 1px solid var(--faint); color: var(--ink); padding: .45em 1.1em; letter-spacing: .06em; }
.dirPull:hover { border-color: var(--amber); }

/* mural de perto */
.cork {
  position: relative; width: min(100%, 112vh); margin-inline: auto; aspect-ratio: 16 / 10; max-width: 100%; border: 1.1em solid #3e2a1a; box-sizing: border-box;
  background-color: #8a6239; box-shadow: 0 18px 50px rgba(0, 0, 0, .8), inset 0 0 60px rgba(30, 15, 5, .6);
  background-image: radial-gradient(rgba(50, 28, 10, .55) 1px, transparent 1.5px), radial-gradient(rgba(200, 150, 90, .3) 1px, transparent 1.5px);
  background-size: 7px 7px, 11px 11px; background-position: 0 0, 3px 5px;
  container-type: inline-size;   /* a letra dos papéis acompanha o tamanho do mural, não da janela */
}
.pinned {
  position: absolute; border: 0; padding: 0; cursor: pointer; transform: rotate(var(--r, 0deg));
  box-shadow: .3em .4em .6em rgba(0, 0, 0, .55); transition: transform .2s, box-shadow .2s;
}
.pinned:hover, .pinned:focus-visible { transform: rotate(var(--r, 0deg)) scale(1.05); box-shadow: .5em .7em 1em rgba(0, 0, 0, .65); z-index: 2; }
.pinned::before { content: ""; position: absolute; top: .25em; left: calc(50% - .32em); width: .64em; height: .64em; border-radius: 50%; background: #a01c14; box-shadow: 0 .1em .15em rgba(0, 0, 0, .6); }

"use strict";
// ===== data.js — textos do jogo (papéis, diário, caderno, nomes) =====
const VIEWS = ['Escada', 'Estante', 'Parede de tijolos', 'Escrivaninha'];

// Os 14 papéis da linha do tempo. `date` ordena; `when` é o que aparece.
// kind define o papel (quadriculado, fichário, caderno, jornal...). `voice` é para o ElevenLabs.
const PAPERS = [
  { id: 16, date: '1974-11-02', when: 'nov 1974', kind: 'aurelio morse', voice: '—', where: 'Oficina, pregada na parede',

// ===== paint.js — texturas e utilidades de desenho =====
const W = 1600, H = 900, FLOOR = 720, WALL_TOP = 95;

function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rgba(r, g, b, a) { return `rgba(${r | 0},${g | 0},${b | 0},${a})`; }
function clipRect(ctx, x, y, w, h) { ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); }
function poly(ctx, pts) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); }

function speckle(ctx, x, y, w, h, n, seed, colors, maxR) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = colors[(r() * colors.length) | 0];
    const s = r() * maxR + .5;
    ctx.fillRect(x + r() * w, y + r() * h, s, s);
  }
}
// mancha difusa; col é um molde 'rgba(r,g,b,A)'
function stain(ctx, cx, cy, rx, ry, col, a) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, col.replace('A', a)); g.addColorStop(.6, col.replace('A', a * .5)); g.addColorStop(1, col.replace('A', 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, 7); ctx.fill(); ctx.restore();
}
// escorridos de umidade e mofo
function drips(ctx, x, y, w, len, seed, col, density) {
  const r = rng(seed), n = (w / 7) * (density || 1);
  for (let i = 0; i < n; i++) {
    const xx = x + r() * w, l = len * (.2 + r() * .8), ww = 1 + r() * 5;
    const g = ctx.createLinearGradient(0, y, 0, y + l);
    g.addColorStop(0, col.replace('A', .5 * r() + .15)); g.addColorStop(1, col.replace('A', 0));
    ctx.fillStyle = g; ctx.fillRect(xx, y, ww, l);
  }
}

function plaster(ctx, x, y, w, h, seed, base) {
  clipRect(ctx, x, y, w, h);
  ctx.fillStyle = base || '#7f6d49'; ctx.fillRect(x, y, w, h);
  const r = rng(seed);
  for (let i = 0; i < 46; i++) stain(ctx, x + r() * w, y + r() * h, 40 + r() * 170, 30 + r() * 120, 'rgba(60,45,22,A)', .1 + r() * .14);
  for (let i = 0; i < 16; i++) stain(ctx, x + r() * w, y + r() * h * .6, 30 + r() * 100, 20 + r() * 70, 'rgba(160,140,95,A)', .1);
  // manchas de infiltração com borda marrom
  for (let i = 0; i < 5; i++) {
    const sx = x + r() * w, sy = y + r() * h * .5, sr = 50 + r() * 110;
    stain(ctx, sx, sy, sr, sr * .8, 'rgba(75,50,20,A)', .32); stain(ctx, sx, sy, sr * .82, sr * .66, 'rgba(140,120,80,A)', .25);
  }
  speckle(ctx, x, y, w, h, 6000, seed + 1, ['rgba(30,22,10,.28)', 'rgba(170,150,110,.16)', 'rgba(40,55,30,.2)'], 2.4);
  drips(ctx, x, y, w, h * .5, seed + 2, 'rgba(28,40,22,A)');
  const g = ctx.createLinearGradient(0, y + h - 180, 0, y + h);
  g.addColorStop(0, 'rgba(30,26,12,0)'); g.addColorStop(1, 'rgba(22,20,8,.7)');
  ctx.fillStyle = g; ctx.fillRect(x, y + h - 180, w, 180);
  ctx.restore();
}

function ceiling(ctx, seed) {
  ctx.fillStyle = '#3b2e1d'; ctx.fillRect(0, 0, W, WALL_TOP);
  const r = rng(seed);
  ctx.strokeStyle = 'rgba(15,10,5,.75)'; ctx.lineWidth = 2;
  for (let x = 0; x < W; x += 60 + r() * 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WALL_TOP); ctx.stroke(); }
  for (const vy of [10, 52]) {
    ctx.fillStyle = '#251c11'; ctx.fillRect(0, vy, W, 20);
    ctx.fillStyle = 'rgba(120,95,60,.22)'; ctx.fillRect(0, vy, W, 3);
  }
  speckle(ctx, 0, 0, W, WALL_TOP, 1800, seed + 3, ['rgba(0,0,0,.35)', 'rgba(140,110,70,.12)'], 2);
  drips(ctx, 0, 0, W, WALL_TOP, seed + 4, 'rgba(10,8,4,A)', .5);
  const g = ctx.createLinearGradient(0, WALL_TOP - 8, 0, WALL_TOP + 40);
  g.addColorStop(0, 'rgba(0,0,0,.7)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, WALL_TOP - 8, W, 48);
}

// taco de peroba em perspectiva
function floor(ctx, seed) {
  const y0 = FLOOR, vx = W / 2, vy = 330, r = rng(seed);
  ctx.fillStyle = '#2f1f10'; ctx.fillRect(0, y0, W, H - y0);
  const rows = []; let y = y0, step = 9; while (y < H + 40) { rows.push(y); y += step; step *= 1.32; }
  const xAt = (xb, yy) => vx + (xb - vx) * ((yy - vy) / (H - vy));
  for (let j = 0; j < rows.length - 1; j++) {
    for (let i = -24; i < 24; i++) {
      const a = vx + i * 85, b = vx + (i + 1) * 85, ya = rows[j], yb = rows[j + 1];
      const t = .82 + r() * .3, alt = (i + j) % 2 ? 1 : .86;
      ctx.fillStyle = rgba(64 * t * alt, 40 * t * alt, 20 * t * alt, 1);
      poly(ctx, [[xAt(a, ya), ya], [xAt(b, ya), ya], [xAt(b, yb), yb], [xAt(a, yb), yb]]); ctx.fill();
    }
  }
  ctx.strokeStyle = 'rgba(10,6,2,.6)'; ctx.lineWidth = 1.2;
  for (let i = -24; i <= 24; i++) { const xb = vx + i * 85; ctx.beginPath(); ctx.moveTo(xAt(xb, y0), y0); ctx.lineTo(xAt(xb, H), H); ctx.stroke(); }
  for (const yy of rows) { ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke(); }
  for (let i = 0; i < 26; i++) stain(ctx, r() * W, y0 + r() * (H - y0), 60 + r() * 220, 8 + r() * 30, 'rgba(20,12,4,A)', .3);
  speckle(ctx, 0, y0, W, H - y0, 3000, seed + 5, ['rgba(0,0,0,.4)', 'rgba(150,100,55,.12)'], 2);
  ctx.fillStyle = '#20150a'; ctx.fillRect(0, y0 - 16, W, 16);
  ctx.fillStyle = 'rgba(140,100,60,.18)'; ctx.fillRect(0, y0 - 16, W, 2);
  const g = ctx.createLinearGradient(0, y0, 0, y0 + 70);
  g.addColorStop(0, 'rgba(0,0,0,.65)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, y0, W, 70);
}

function bricks(ctx, x, y, w, h, seed) {
  clipRect(ctx, x, y, w, h);
  ctx.fillStyle = '#4e3a2c'; ctx.fillRect(x, y, w, h);

const SEG = { '0': 'abcdef', '1': 'bc', '2': 'abged', '3': 'abgcd', '4': 'fgbc', '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg', '9': 'abcdfg', '-': 'g', ' ': '' };
function seg7(ctx, str, x, y, h, on, off) {
  const w = h * .52, t = h * .12; let cx = x;
  for (const ch of str) {

      ctx.fillRect(cx + w * .1, y + h * .28, t, t); ctx.fillRect(cx + w * .1, y + h * .66, t, t);
      cx += w * .45; continue;
    }
    const lit = SEG[ch] || '';
    const segs = {
      a: [cx + t, y, w - 2 * t, t], d: [cx + t, y + h - t, w - 2 * t, t], g: [cx + t, y + h / 2 - t / 2, w - 2 * t, t],
      f: [cx, y + t, t, h / 2 - t], b: [cx + w - t, y + t, t, h / 2 - t],
      e: [cx, y + h / 2, t, h / 2 - t], c: [cx + w - t, y + h / 2, t, h / 2 - t],

    for (const k in segs) {
      const col = lit.includes(k) ? on : off; if (!col) continue;
      ctx.fillStyle = col; ctx.fillRect(...segs[k]);
    }
    cx += w + h * .16;
  }
}

const S = {};
function resetState() {
  Object.assign(S, {
    view: 0, started: false, ended: false,
    fuse: false, fuseTaken: false, power: false, powerAt: 0,
    inv: [], sel: null, cp: null, tvOn: false, blackoutUntil: 0, papers: new Set(), seen: new Set(), flags: {},
    open: { gav1: false, gav2: false, gav3: false, esc: false, oficina: false, estante: false }, corr: 0, found: {}, caixaAt: 0, dropPauseUntil: 0,
    lockVals: { gav1: ['M', 'Z', 'K', 'Q'] },

  });

// a ficção vai de 02:05 a 05:10 (185 min) em 60 minutos reais: do lado de lá a hora passa mais rápido
// (no livro, o relógio para enquanto a pessoa lê)
const START_MIN = 125, END_MIN = 310, REAL_MIN = 60;
function fictionMin() {
  if (!S.started) return START_MIN;
  const real = (performance.now() - S.t0) / 60000;
  return Math.min(END_MIN, START_MIN + real * (END_MIN - START_MIN) / REAL_MIN);
}
function clockText() {
  const m = Math.floor(fictionMin());
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}

const $ = (id) => document.getElementById(id);
const stage = $('stage'), cv = $('scr'), cx = cv.getContext('2d'), hud = $('hud');
const box = { x: 0, y: 0, w: W, h: H };
function fit() {
  const r = stage.getBoundingClientRect(), s = Math.min(r.width / W, r.height / H);
  box.w = Math.round(W * s); box.h = Math.round(H * s);
  box.x = Math.round((r.width - box.w) / 2); box.y = Math.round((r.height - box.h) / 2);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(box.w * dpr); cv.height = Math.round(box.h * dpr);
  Object.assign(cv.style, { left: box.x + 'px', top: box.y + 'px', width: box.w + 'px', height: box.h + 'px' });
  hud.style.setProperty('--gx', box.x + 'px'); hud.style.setProperty('--gy', box.y + 'px');
  hud.style.setProperty('--gw', box.w + 'px'); hud.style.setProperty('--gh', box.h + 'px');
}

function drawDark(g, t) {
  const k = mask.width / W, uv = S.sel === 'uv';
  const bx = (beam.x + Math.sin(t / 130) * 2 + Math.sin(t / 47) * 1.3) * k, by = (beam.y + Math.cos(t / 170) * 2) * k;

  if (t < S.battUntil) { A = Math.random() < .5 ? .25 : .7; R *= .9; }
  if (uv) { A *= .4; R *= .85; }

  mg.fillStyle = 'rgba(1,1,0,.988)'; mg.fillRect(0, 0, mask.width, mask.height);
  mg.globalCompositeOperation = 'destination-out';

// granulação de filme velho
const grains = [];
for (let i = 0; i < 5; i++) {

// luz negra: só revela a camada UV dentro do círculo roxo

}

// coisas que se mexem antes da luz ser aplicada (a goteira na lata)
function drawDyn(g, t) {
  if (S.view !== 0 || t < S.dropPauseUntil) return;
  const cyc = t % 11000;
  if (cyc < 650) { const y = 104 + (cyc / 650) ** 2 * 546; g.fillStyle = 'rgba(190,200,190,.6)'; g.beginPath(); g.ellipse(723, y, 2, 4, 0, 0, 7); g.fill(); }

}

// ——— pontos clicáveis ———
const SPOTS = [];
function spot(view, id, rect, o) { SPOTS.push(Object.assign({ view, id, rect }, o)); }
function hitSpot(p) {
  for (let i = SPOTS.length - 1; i >= 0; i--) {
    const s = SPOTS[i];
    if (s.view !== S.view || (s.when && !s.when())) continue;
    const [x, y, w, h] = typeof s.rect === 'function' ? s.rect() : s.rect;
    if (p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h) return s;
  }
  return null;
}
function litNow() { return S.power || S.view >= 5; }
function visibleAt(p) { return litNow() || Math.hypot(p.x - beam.x, p.y - beam.y) < BEAM_R * .9; }
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }

let hoverSpot = null;
function updateLabel() {
  const s = overlayOpen() ? null : hitSpot(ptr), ok = s && visibleAt(ptr);
  hoverSpot = ok ? s : null;
  const txt = ok ? (typeof s.label === 'function' ? s.label() : s.label) : '';
  const lab = $('label');
  const pre = S.sel && S.sel !== 'uv' && ok ? `Usar ${ITEMS[S.sel].name.toLowerCase()} em: ` : '';
  if (lab.textContent !== pre + txt) lab.textContent = pre + txt;
  cv.style.cursor = S.sel === 'uv' || !litNow() ? (ok ? 'crosshair' : 'none') : (ok ? 'pointer' : 'default');
}

cv.addEventListener('pointermove', (e) => { const p = toLogical(e); ptr.x = p.x; ptr.y = p.y; });
cv.addEventListener('pointerdown', (e) => {
  const p = toLogical(e); ptr.x = p.x; ptr.y = p.y;
  if (e.pointerType !== 'mouse') { beam.x = p.x; beam.y = p.y; }
  if (!S.started || S.ended || overlayOpen() || fadeDir) return;
  const s = hitSpot(p);
  if (!s || !visibleAt(p)) { if (S.sel) selectItem(null); return; }
  if (S.sel) {
    if (s.use && s.use(S.sel) !== false) return;
    // a luz negra é luz, não ferramenta: sem uso específico, examina normalmente
    if (S.sel !== 'uv') { say('Isso não serve aí.'); return; }

});

// ——— virar entre as paredes ———
let fade = 0, fadeDir = 0, pendingView = 0;
function turn(d) {
  if (fadeDir || !S.started || overlayOpen() || S.view > 3) return;
  const v = (S.view + d + 4) % 4;
  if (!S.power && v >= 2) { say(v === 2 ? 'Para esse lado, a lanterna não alcança nada: só o escuro e o barulho dos canos. Primeiro, a luz.' : 'Escuro fechado. A lanterna fraca não chega lá. Primeiro, a luz.'); return; }
  goView(v);
}
// troca de cena com escurecida (também entra na oficina, no corredor, no ponto)
function goView(v, after) { if (fadeDir) return; pendingView = v; fadeDir = 1; hideMsg(); goView.after = after || null; }
$('turnL').addEventListener('click', () => turn(-1));
$('turnR').addEventListener('click', () => turn(1));
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') { if (e.key === 'Escape') closeOv(); return; }
  if (e.key === 'Escape') { closeOv(); selectItem(null); }
  else if (e.key === 'ArrowLeft' || e.key === 'a') turn(-1);
  else if (e.key === 'ArrowRight' || e.key === 'd') turn(1);
  else if (e.key === 'c' && S.started) openNotes();
  else if (e.key === 'l' && S.started) openTimeline();
});

// ——— laço principal ———
let lastLabel = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (!S.started) return;
  if (fadeDir === 1) { fade += .16; if (fade >= 1) { fade = 1; S.view = pendingView; $('viewName').textContent = VIEWS[S.view]; fadeDir = -1; syncNav(); if (goView.after) { const a = goView.after; goView.after = null; a(); } } }
  else if (fadeDir === -1) { fade -= .1; if (fade <= 0) { fade = 0; fadeDir = 0; } }
  const g = cx;
  g.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  beam.x += (ptr.x - beam.x) * .2; beam.y += (ptr.y - beam.y) * .2;
  g.drawImage(scene(S.view), 0, 0);
  drawDyn(g, t);
  if (litNow()) drawLit(g, t); else drawDark(g, t);
  EMIT[S.view](g, S, t);
  if (S.sel === 'uv') drawUV(g);
  drawGrain(g, t);
  if (fade > 0) { g.fillStyle = `rgba(0,0,0,${fade})`; g.fillRect(0, 0, W, H); }
  if (t - lastLabel > 90) { lastLabel = t; updateLabel(); tickClock(); }
}
const TICKS = []; // verificações periódicas das ondas (ex.: evento das 03:40)
function tickClock() {

  { const c = $('clock'); const txt = clockText(); if (c.textContent !== txt) c.textContent = txt; }
  if (!S.ended && fictionMin() >= END_MIN) endBad();
}

const LOCKS = {
  gav1: { type: 'wheels', chars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', answer: 'ROTA', title: 'Gaveta de cima · cadeado de letras',
    open() {

      say('O cadeado abre com um estalo que você sente nos dentes. Dentro, um diário de capa dura verde, com elástico, e um mapa dobrado dentro dele. Atrás de você, na escrivaninha, alguma coisa zumbe e acende.');
      toast('O mapa da Marina foi para a linha do tempo.');
      setTimeout(() => { if (!overlayOpen()) openDiary(); }, 2600);
    } },
};
const ARROW = { U: '↑', D: '↓', L: '←', R: '→' };

function openLock(id) {
  const L = LOCKS[id], box = $('lockBox');
  box.className = ''; box.textContent = '';
  $('lockMsg').textContent = ''; $('lockTitle').textContent = L.title;
  const sh = document.createElement('div'); sh.className = 'shackle'; box.append(sh);
  buildWheels(id, L, box);
  openOv('ovLock');
}
function unlock(id) {
  const box = $('lockBox'); box.classList.add('open'); $('lockMsg').textContent = 'Clique.';
  box.querySelectorAll('button').forEach(b => { b.disabled = true; });
  setTimeout(() => { hideAllOv(); LOCKS[id].open(); }, 950);
}
function buildWheels(id, L, box) {
  const body = document.createElement('div'); body.className = 'lockBody';
  const vals = S.lockVals[id];
  vals.forEach((ch, i) => {
    const w = document.createElement('div'); w.className = 'wheel';
    const up = document.createElement('button'), out = document.createElement('output'), dn = document.createElement('button');
    up.type = dn.type = 'button'; up.textContent = '▲'; dn.textContent = '▼';
    up.setAttribute('aria-label', `Roda ${i + 1}: anterior`); dn.setAttribute('aria-label', `Roda ${i + 1}: próxima`);
    out.textContent = ch;
    const spin = (d) => {
      const k = L.chars.indexOf(vals[i]), n = (k + d + L.chars.length) % L.chars.length;
      vals[i] = L.chars[n]; out.textContent = vals[i];
      out.classList.remove('tick'); void out.offsetWidth; out.classList.add('tick');
      if (vals.join('') === L.answer) unlock(id);
    };
    up.addEventListener('click', () => spin(-1)); dn.addEventListener('click', () => spin(1));
    w.append(up, out, dn); body.append(w);
  });
  box.append(body);
}

function uvInk(ctx) { ctx.shadowColor = 'rgba(120,255,235,.95)'; ctx.shadowBlur = 14; ctx.fillStyle = '#d4fff7'; ctx.strokeStyle = '#d4fff7'; }
// o caminho da solução, do furo de cima até a saída de baixo
function mazeTrace(x0, y0, cw, ch) {
  const pts = [[x0 + (MAZE.start[0] + .5) * cw, y0 - ch * .4]];
  for (const [c, r] of MAZE.sol) pts.push([x0 + (c + .5) * cw, y0 + (r + .5) * ch]);
  pts.push([x0 + (MAZE.exitCol + .5) * cw, y0 + (MAZE.rows + .2) * ch]);
  return pts;
}

// ===== vhs.js — fita copiada de fita até sobrar quase nada (lost media) =====
// Desenha a cena em 320x240, depois estraga: linhas tremendo, faixa de tracking,
// fantasma de cor, chiado, scanlines, cor lavada, data de filmadora.
const VW = 320, VH = 240;
function makeVHS(out) {
  const src = mk(VW, VH), sg = src.getContext('2d');
  const tmp = mk(VW, VH), tg = tmp.getContext('2d');
  const og = out.getContext('2d');
  const noise = [];
  for (let i = 0; i < 6; i++) {
    const c = mk(VW, VH), g = c.getContext('2d'), d = g.createImageData(VW, VH);
    for (let p = 0; p < d.data.length; p += 4) { const v = Math.random() * 255; d.data[p] = d.data[p + 1] = d.data[p + 2] = v; d.data[p + 3] = 255; }
    g.putImageData(d, 0, 0); noise.push(c);
  }
  const lines = mk(4, 4), lg = lines.getContext('2d');
  lg.fillStyle = 'rgba(0,0,0,.45)'; lg.fillRect(0, 2, 4, 2);
  let hold = 0, held = false;
  // vídeo filmado: só o que uma fita copiada faz de verdade (tremida de linha, tracking, chiado leve)
  const real = function (t, o) {
    const W2 = out.width, H2 = out.height, k = W2 / VW, img = o.img, iw = img.videoWidth || VW, ih = img.videoHeight || VH;
    const band = ((t / 18) % (VH + 80)) - 40, tr = o.track || 0, sh = 6;
    og.globalCompositeOperation = 'source-over'; og.globalAlpha = 1; og.imageSmoothingEnabled = true;
    og.fillStyle = '#000'; og.fillRect(0, 0, W2, H2);
    for (let y = 0; y < VH; y += sh) {
      let dx = (Math.random() - .5) * .5;
      if (Math.abs(y - band) < 14) dx += (Math.random() - .5) * (2 + 18 * tr);
      if (y > VH - 10) dx += 3 + Math.random() * 5; // borda de baixo rasgada
      if (Math.random() < .003) dx += (Math.random() - .5) * 16;
      og.drawImage(img, 0, y / VH * ih, iw, sh / VH * ih, dx * k, y * k, W2, sh * k + 1);
    }
    og.globalCompositeOperation = 'lighter'; og.globalAlpha = .06; og.drawImage(out, 2.5 * k, 0, W2, H2);
    og.globalCompositeOperation = 'source-over';
    const n = noise[(Math.random() * noise.length) | 0];
    og.globalAlpha = o.snow != null ? o.snow : .05 + tr * .2; og.drawImage(n, 0, 0, W2, H2);
    og.globalAlpha = .1 + tr * .45; og.drawImage(n, 0, 0, VW, 14, 0, (band - 7) * k, W2, 14 * k);
    og.globalAlpha = .3; og.fillStyle = og.createPattern(lines, 'repeat'); og.fillRect(0, 0, W2, H2);
    og.globalAlpha = 1;
    const v = og.createRadialGradient(W2 / 2, H2 / 2, H2 * .35, W2 / 2, H2 / 2, W2 * .75);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); og.fillStyle = v; og.fillRect(0, 0, W2, H2);
    if (o.overlay) { og.save(); og.scale(k, k); o.overlay(og, t); og.restore(); }
    og.font = `${Math.round(17 * k)}px VT323, monospace`; og.textBaseline = 'alphabetic';
    og.shadowColor = 'rgba(0,0,0,.9)'; og.shadowBlur = 3 * k; og.fillStyle = `rgba(255,248,230,${Math.random() < .05 ? .5 : .9})`;
    if (o.stamp) { og.fillText(o.stamp[0], W2 - 108 * k, H2 - 30 * k); og.fillText(o.stamp[1], W2 - 108 * k, H2 - 14 * k); }
    og.shadowBlur = 0;
  };
  return {
    sg, real,
    // o: { track: 0..1 tracking ruim, snow: 0..1 só chiado, stamp: [linha1, linha2], osd: texto no canto }
    frame(t, o) {
      const W2 = out.width, H2 = out.height, k = W2 / VW;
      if (held && t < hold) return; // quadro congelado
      held = false;
      if (Math.random() < .006) { hold = t + 120 + Math.random() * 260; held = true; }
      if (o.real) return this.real(t, o);
      tg.fillStyle = '#000'; tg.fillRect(0, 0, VW, VH);
      const band = ((t / 18) % (VH + 80)) - 40, tr = o.track || 0;
      for (let y = 0; y < VH; y += 2) {
        let dx = (Math.random() - .5) * 1.2;
        const nb = Math.abs(y - band);
        if (nb < 18) dx += (Math.random() - .5) * (6 + 22 * tr);
        if (y > VH - 14) dx += 6 + Math.random() * 8; // borda de baixo rasgada
        if (Math.random() < .005) dx += (Math.random() - .5) * 40;
        tg.drawImage(src, 0, y, VW, 2, dx, y, VW, 2);
      }
      og.globalCompositeOperation = 'source-over'; og.globalAlpha = 1; og.imageSmoothingEnabled = true;
      og.drawImage(tmp, 0, 0, W2, H2);
      og.globalCompositeOperation = 'lighter'; og.globalAlpha = .2; og.drawImage(tmp, 3.5 * k, 0, W2, H2);
      og.globalCompositeOperation = 'multiply'; og.globalAlpha = 1;
      og.fillStyle = 'rgb(205,215,190)'; og.fillRect(0, 0, W2, H2);
      og.globalCompositeOperation = 'source-over';
      const n = noise[(Math.random() * noise.length) | 0];

// A fita JUN 86 (Marina, 6/6/1986). Tempos em segundos.
const FILM86 = {
  dur: 54, motor: [[13, 34, .07]],
  // o relógio da filmadora: 23:08:20 no começo da imagem, 23:09:00 no tique, 23:10 o ônibus, 23:11 a respiração,
  // 23:13 a câmera cai, 23:14 a faixa amarela, 23:15 "Eu pintei igual" (é o que o capítulo 7 reconstitui)
  subs: [[9.5, 11.5, '[um tique de relógio, dentro da casa]'], [13, 19, '[motor a diesel, chegando devagar]'], [22, 29, '[respiração bem perto do microfone]'], [34, 36, '[a câmera cai]'],
    [37, 43, '[passos descendo uma escada de madeira]'], [45.5, 48.5, '[a faixa amarela vira à esquerda. A câmera vira à esquerda]'], [48.6, 51.5, '“Eu pintei igual.”', 'marina-fita']],
  draw(g, t) {
    if (t < 2.2) { vcrBlue(g, 'PLAY ►'); return { snow: 0, track: 0 }; }
    if (t < 6) { g.fillStyle = '#000'; g.fillRect(0, 0, VW, VH); return { snow: .9 - (t - 2.2) * .18, track: 1 }; }
    const clock = (s) => { const tot = 23 * 3600 + 9 * 60 + (s - 10) * 10; const h = Math.floor(tot / 3600) % 24, m = Math.floor(tot / 60) % 60, sc = Math.floor(tot) % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sc).padStart(2, '0')}`; };
    const stamp = ['JUN. 6 1986', clock(t)];
    if (t < 34) {
      ruaDaJanela(g, t * 1000);
      if (t > 12) { const x = t < 20 ? -560 + (t - 12) / 8 * 470 : -90; onibus(g, x + Math.sin(t * 9) * (t < 20 ? 1 : 0), t > 22); }
      if (t > 22) { g.fillStyle = 'rgba(0,0,0,.08)'; g.fillRect(0, 0, VW, VH); }
      return { stamp, track: t < 8 ? .6 : .15 + (t > 28 ? .25 : 0) };
    }
    if (t < 36) { // a câmera cai: gira, borra
      const a = (t - 34) / 2;
      g.save(); g.translate(VW / 2, VH / 2); g.rotate(a * 1.9); g.scale(1 + a * .6, 1 + a * .6); g.translate(-VW / 2, -VH / 2 + a * 120);
      ruaDaJanela(g, t * 1000); onibus(g, -90, true); g.restore();
      g.fillStyle = `rgba(0,0,0,${a * .8})`; g.fillRect(0, 0, VW, VH);
      return { stamp, track: .9 };
    }
    if (t < 44) { tetoDoPorao(g, t * 1000); return { stamp, track: .25 }; }
    if (t < 45.5) { g.fillStyle = '#000'; g.fillRect(0, 0, VW, VH); return { snow: .85, track: 1 }; }
    if (t < 51.5) { corredorAmarelo(g, t * 1000); return { stamp, track: .35 }; }
    if (t < 52.5) { g.fillStyle = '#000'; g.fillRect(0, 0, VW, VH); return { snow: .9, track: 1 }; }
    vcrBlue(g, 'STOP ■'); return { snow: 0, track: 0 };
  },
};

let linesTimer = 0;
function playLines(listEl, ovId, lines, onEnd) {
  clearTimeout(linesTimer); listEl.textContent = '';
  const gen = playLines.gen = (playLines.gen || 0) + 1;
  let i = 0;
  const next = () => {
    if (playLines.gen !== gen || $(ovId).hidden) return; // desligaram no meio
    if (i >= lines.length) { onEnd && onEnd(); return; }
    const l = lines[i++], li = document.createElement('li');
    if (l.sys) { li.className = 'sys'; li.textContent = l.sys; }
    else if (l.me) { li.className = 'me'; li.textContent = l.me; }
    else { li.innerHTML = `<span class="who">${l.who}</span>`; const s = document.createElement('span'); s.className = 'voice' + (l.noisy ? ' noisy' : ''); s.textContent = l.text; li.append(s); }
    listEl.append(li);
    while (listEl.children.length > 5) listEl.firstChild.remove();
    const txt = l.sys || l.me || l.text;
    const temBip = !!(l.sys && l.sys.startsWith('[BIP]') && typeof SFX !== 'undefined');
    if (temBip) SFX.bip();
    let wait = l.d != null ? l.d : Math.max(1800, txt.length * 58);
    if (l.sys && l.sys.startsWith('[chamando') && typeof SFX !== 'undefined') {
      const n = (l.sys.match(/tuuu/g) || []).length >= 2 ? 2 : 1; SFX.ring(n); if (SFX.ringMs) wait = Math.max(wait, SFX.ringMs(n));
    }
    if (l.v && typeof hasVoice === 'function' && hasVoice(l.v)) {
      const falar = () => { if (playLines.gen !== gen || $(ovId).hidden) return;
        voice(l.v, l.fx).then(() => { if (playLines.gen === gen && !$(ovId).hidden) linesTimer = setTimeout(next, 450); }); };
      if (temBip && SFX.bipMs) linesTimer = setTimeout(falar, SFX.bipMs()); else falar();
    }
    else { if (l.noisy && typeof AUD !== 'undefined') AUD.noisyUntil = performance.now() + wait; linesTimer = setTimeout(next, wait); }
  };
  next();
}

const MZ = { x0: 10, y0: 30, cw: 60, ch: 54 };
let ball = null, mazeBusy = false, mazeUV = false;
const DIRS = { L: [-1, 0], R: [1, 0], U: [0, -1], D: [0, 1] };
function mazeBlocked(c, r, d) {
  const { cols, rows, h, v, exitCol } = MAZE;
  if (d === 'L') return c === 0 || v.has(`${c - 1},${r}`);
  if (d === 'R') return c === cols - 1 || v.has(`${c},${r}`);
  if (d === 'U') return r === 0 || h.has(`${c},${r - 1}`);
  if (r === rows - 1) return c !== exitCol; // embaixo: só passa pela saída
  return h.has(`${c},${r}`);
}
function drawMaze() {
  const cv = $('mazeCv'), g = cv.getContext('2d'), { x0, y0, cw, ch } = MZ;
  g.fillStyle = '#0c1210'; g.fillRect(0, 0, cv.width, cv.height);
  const sh = g.createLinearGradient(0, 0, cv.width, cv.height); sh.addColorStop(0, 'rgba(255,255,255,.07)'); sh.addColorStop(.4, 'rgba(255,255,255,0)');
  g.fillStyle = sh; g.fillRect(0, 0, cv.width, cv.height);
  if (mazeUV) { g.save(); uvInk(g); g.lineWidth = 3; g.setLineDash([9, 7]); path(g, mazeTrace(x0, y0, cw, ch), 0, 0); g.stroke(); g.restore();
    g.fillStyle = 'rgba(90,30,220,.18)'; g.fillRect(0, 0, cv.width, cv.height); }
  drawMazeWalls(g, x0, y0, cw, ch, '#a7aca6', 5);
  if (ball) {
    const bx = x0 + (ball.c + .5) * cw, by = y0 + (ball.r + .5) * ch;
    const rg = g.createRadialGradient(bx - 6, by - 6, 2, bx, by, 18); rg.addColorStop(0, '#fff'); rg.addColorStop(.35, '#b9bbb8'); rg.addColorStop(1, '#2d2e2c');
    g.fillStyle = 'rgba(0,0,0,.5)'; g.beginPath(); g.ellipse(bx + 4, by + 6, 16, 10, 0, 0, 7); g.fill();
    g.fillStyle = rg; g.beginPath(); g.arc(bx, by, 16, 0, 7); g.fill();

}
function openMaze() {

function tilt(d) {
  if (mazeBusy || !ball || $('ovMaze').hidden) return;
  const [dc, dr] = DIRS[d], steps = [];
  let c = ball.c, r = ball.r;
  while (!mazeBlocked(c, r, d)) { c += dc; r += dr; steps.push([c, r]); if (r >= MAZE.rows) break; }
  if (!steps.length) { $('mazeMsg').textContent = 'A bolinha não se mexe para esse lado.'; return; }
  mazeBusy = true; $('mazeMsg').textContent = '';

  const go = () => {
    if ($('ovMaze').hidden) { mazeBusy = false; return; }
    ball.c = steps[i][0]; ball.r = steps[i][1]; drawMaze(); i++;
    if (ball.r >= MAZE.rows) { mazeDone(); return; }
    if (i < steps.length) setTimeout(go, 75); else mazeBusy = false;
  };
  go();
}

const SFX = {

  drip(v) { if (!sample('gota', .3 * v)) { tone(1900, .09, 'sine', .07 * v, 650); burst(.03, 'bandpass', 3000, 3, .03 * v); } },
  thud(v, d) { tone(95, .3, 'sine', .5 * (v || 1), 38, d); burst(.1, 'lowpass', 320, 1, .25 * (v || 1), d); },
  knock() { SFX.thud(.6); burst(.6, 'bandpass', 880, 9, .12, .02); burst(.5, 'bandpass', 1320, 12, .06, .05); },
  creak(d) { tone(210, .7, 'sawtooth', .02, 150, d); burst(.6, 'bandpass', 700, 14, .05, d, .2); },
  tick(d) { burst(.014, 'bandpass', 3600, 2, .3, d); },
  clunk() { SFX.tick(); SFX.thud(.5, .03); burst(.08, 'highpass', 2500, 1, .15, .02); },
  // bipe e telefone: o som gravado (audio/bip.mp3, telefone-*.mp3) se existir; senão, sintetizado

const vis = (id) => { const e = document.getElementById(id); return e && !e.hidden; };
function audioTick() {
  if (!AUD.ctx) return;
  const now = performance.now(), porao = S.started && S.view <= 3, silent = now < AUD.silenceUntil;
  const intro = vis('intro') && vis('tvIntro');
  setG('rain', silent ? 0 : intro ? .012 : !S.started ? .02 : S.view === 6 ? .085 : S.view === 4 ? .007 : porao ? .018 : 0, silent ? .02 : .4);
  setG('rumble', S.started ? .03 : 0);
  const dark = now < S.blackoutUntil;
  setG('hum', S.started && S.power && S.view <= 4 && !dark ? .01 : 0, .05);
  setG('fluor', S.view === 5 ? .012 : 0);
  // fitas: chiado e motor por trecho
  let motor = 0, hiss = 0;
  if (vis('ovVideo') && AUD.film) {
    const t = (now - AUD.filmT0) / 1000; hiss = .05;
    for (const [a, b, v] of (AUD.film.motor || [])) if (t >= a && t < b) motor = v;
    for (const s of AUD.film.subs) if (s[3] && t >= s[0] && !AUD.filmPlayed.has(s[3])) { AUD.filmPlayed.add(s[3]); voice(s[3], s[4]); }
  } else if (intro) hiss = .035;
  else if (vis('ovTape') && document.querySelector('.machine.play')) hiss = .02;
  else if (S.tvOn && S.power && S.view === 3 && !vis('ovVideo')) hiss = .02;
  if (S.view === 5 && !vis('ovVideo')) motor = .03 + S.corr * .035;
  setG('motor', motor, .5); setG('hiss', hiss);

  if (vis('ovRadio')) {
    const d = Math.abs(parseFloat($('tune').value) - 23.1);
    chiado = Math.max(chiado, d < .035 ? .012 : d < .6 ? .03 : .05);
    morse = d < .035 ? (S.flags.marina && !curVoice ? .05 : .012) : d < .6 ? .06 * (1 - d / .6) : 0;
    scheduleMorse();
  }
  setG('chiado', chiado, .08); setG('morse', morse, .08);
  // goteira na lata (mesmo ritmo do desenho)

    if (crossed && !overlayOpen() && now >= S.dropPauseUntil) SFX.drip(S.view === 0 ? 1 : .35);

// morse: 06 06 76 / 23 10 / 875A-10, agendado um pouco à frente
const MORSE_CODE = { '0': '-----', '1': '.----', '2': '..---', '3': '...--', '5': '.....', '6': '-....', '7': '--...', '8': '---..', 'A': '.-',

          const hp = AUD.ctx.createBiquadFilter(), lp = AUD.ctx.createBiquadFilter();
          hp.type = 'highpass'; hp.frequency.value = fx === 'tv' ? 250 : 350; lp.type = 'lowpass'; lp.frequency.value = fx === 'radio' ? 2600 : 3400;
          node.connect(hp); hp.connect(lp); node = lp;
          if (fx === 'radio') AUD.noisyUntil = performance.now() + 60000;
        }
        node.connect(AUD.master);
      } catch (e) { /* toca direto */ }
    }
    const done = (ok) => { if (fx === 'radio') AUD.noisyUntil = 0; if (curVoice === a) curVoice = null; res(ok); };
    a.onended = () => done(true); a.onerror = () => done(false);
    a.play().catch(() => done(false));
  });
}

// ===== wave7.js — fitas com vídeo de verdade (Flow/Veo), passadas pelo mesmo VHS =====
// Cada fita é um arquivo só, já com os cortes de chiado no lugar (media/build-tapes.sh).
// Se o arquivo não carregar, a fita volta a ser a desenhada (o FILM antigo).
const TAPES = {};
function tapeEl(src) {
  if (TAPES[src]) return TAPES[src];
  const v = document.createElement('video');
  // WebM (VP9) onde der; MP4 (H.264) no Safari e afins
  v.src = v.canPlayType('video/webm; codecs="vp9, opus"') ? src.replace(/\.mp4$/, '.webm') : src; v.preload = 'auto'; v.playsInline = true; v.setAttribute('playsinline', '');
  v.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
  v.setAttribute('aria-hidden', 'true');
  document.body.appendChild(v);
  TAPES[src] = v; return v;
}
const tapeOK = (v) => v && !v.error && v.readyState >= 2;
function tapeSync(v, t) {
  v.muted = !AUD.on;
  if (v.paused && !v.ended) v.play().catch(() => {});
  if (Math.abs(v.currentTime - t) > .3) { try { v.currentTime = t; } catch (e) { /* ainda carregando */ } }
}
const inR = (t, rs) => rs.find(r => t >= r[0] && t < r[1]);

// troca o conteúdo de um FILM pela versão em vídeo, guardando a desenhada como reserva
function useTape(film, spec) {
  const old = { dur: film.dur, subs: film.subs, motor: film.motor, draw: film.draw };
  const v = tapeEl(spec.src);
  const draw = function (g, t) {
    const stamp = spec.stamp(t);
    if (t < 2) { vcrBlue(g, 'PLAY ►'); return { snow: 0 }; }
    if (t >= spec.dur - 1) { vcrBlue(g, 'STOP ■'); v.pause(); return { snow: 0 }; }
    tapeSync(v, t);
    const cut = inR(t, spec.cuts);
    if (cut && !cut[2]) { g.fillStyle = '#000'; g.fillRect(0, 0, VW, VH); return { snow: .92, track: 1 }; }
    const near = spec.cuts.some(c => t >= c[0] - .35 && t < c[0]);
    if (inR(t, spec.vid)) {
      if (!tapeOK(v)) { g.fillStyle = '#000'; g.fillRect(0, 0, VW, VH); return { snow: .6, track: 1, stamp }; }
      const r = { stamp, real: true, img: v, overlay: spec.extra };
      if (cut) return Object.assign(r, { snow: .45, track: 1 }); // falha dentro da cena (rasgo de tracking)
      return Object.assign(r, { track: near ? .9 : .12 });
    }
    g.fillStyle = '#000'; g.fillRect(0, 0, VW, VH); return { snow: .8, track: 1 };
  };
  film.tape = { spec, v, old, neu: { dur: spec.dur, subs: spec.subs, motor: spec.motor, draw } };
  Object.assign(film, film.tape.neu);
}

// ===== livro.js — o porão dentro do livro (Diver Livro) =====
// Quando o jogo roda dentro do site do livro (porao/index.html?livro=1):
// - não mostra a abertura da TV (o livro já passou a fita) e começa direto no escuro;
// - avisa o livro a cada marco da investigação, e o livro solta a página seguinte do caderno;
// - para o relógio e o som enquanto a pessoa lê;
// - no final, entrega a última cena para o livro (capítulos 9 e 10) em vez do filme do jogo.
const NO_LIVRO = /[?&]livro=1/.test(location.search) && window.parent !== window;
if (NO_LIVRO) {
  const avisa = (d) => { try { window.parent.postMessage(Object.assign({ ultimaParada: true }, d), '*'); } catch (e) { /* sem livro */ } };
  showIntro = function () {
    $('intro').hidden = true; if ($('tvIntro')) $('tvIntro').hidden = true;
    startGame(false);
  };
  // os marcos, na ordem do livro: cada um solta um capítulo (o livro garante a ordem)
  const MARCOS = [
    ['luz', () => S.power],            // o fusível: a luz acende → capítulo 3
    ['rota', () => S.open.gav1],       // o cadeado ROTA da cômoda → capítulo 4
    ['pai', () => S.flags.pai],        // a senha 0606 do CP-500 → capítulo 5
    ['caixa', () => S.found.caixa],    // a caixa de chumbo na bancada da oficina → capítulo 6
    ['radio', () => S.flags.marina],   // o receptor da oficina em 23.10, depois que a voz da Marina termina → capítulo 7
    ['estante', () => S.open.estante], // o volume sete, a estante gira → capítulo 8
    ['fim', () => S.flags.won],        // 05h10, a caixa no ônibus → capítulo 9
  ];
  const enviados = new Set();
  TICKS.push(() => {
    for (const [k, f] of MARCOS) if (!enviados.has(k) && f()) { enviados.add(k); avisa({ marco: k }); }
  });
  // pausa enquanto a pessoa lê: o relógio da ficção e o som param
  // (a cada verificação, empurra o começo da partida para frente: o tempo parado não conta)
  let pausado = false, ultimo = 0;
  TICKS.unshift(() => {
    if (!pausado) return;
    const agora = performance.now(), dt = agora - ultimo; ultimo = agora;
    if (S.started) { S.t0 += dt; S.nextBatt += dt; S.nextFlick += dt; }
  });
  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (!d.ultimaParada) return;
    if (d.acao === 'pausa' && !pausado) {
      pausado = true; window.LIVRO_PAUSADO = true; ultimo = performance.now();
      if (AUD.ctx && AUD.ctx.state === 'running') AUD.ctx.suspend();
    } else if (d.acao === 'continua' && pausado) {
      const dt = performance.now() - ultimo; pausado = false; window.LIVRO_PAUSADO = false;
      if (S.started) { S.t0 += dt; S.nextBatt += dt; S.nextFlick += dt; }
      if (AUD.ctx && AUD.on) AUD.ctx.resume();
    }
  });
  // o fim ruim também é do livro: tela preta, "VOCÊ FALHOU", e volta ao começo
  endBad = function () {
    S.ended = true; closeOv(); hideMsg();
    if (AUD.ctx && AUD.ctx.state === 'running') AUD.ctx.suspend();
    avisa({ falhou: true });
  };
  // o final é do livro
  finale = function () {
    S.flags.won = true; removeItem('caixa'); dirty(6); S.ended = true; closeOv(); hideMsg();
    if (!enviados.has('fim')) { enviados.add('fim'); avisa({ marco: 'fim' }); }
  };
  avisa({ pronto: true });
}
