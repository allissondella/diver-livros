# Publica no GitHub Pages a cada push na main: a vitrine em / e cada livro em /<titulo>/
name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar os livros
        run: |
          mkdir -p _site
          cp site/index.html _site/
          # Última Parada: o livro na raiz do título, o porão (jogo) em /porao/
          python3 livros/ultima-parada/site/build.py
          mkdir -p _site/ultima-parada/porao
          cp -r livros/ultima-parada/site/. _site/ultima-parada/
          rm -f _site/ultima-parada/build.py
          sh livros/ultima-parada/jogo/build.sh
          cp livros/ultima-parada/jogo/dist/index.html _site/ultima-parada/porao/
          # as vozes (secretária, rádio): as mesmas para o livro e para o porão
          cp -r livros/ultima-parada/site/audio _site/ultima-parada/porao/audio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
